<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!DOCTYPE html>
<html>
<head>
    <title>My CSS websiiiitte</title>

    <style>

        /* =========================
           BASIC CSS
           ========================= */

        body {
            background-color: rgb(3, 3, 128);
            color: rgba(141, 222, 19, 0.863);
            font-family: Roboto, sans-serif;    
        }

        h1 {
            color: rgba(225, 161, 13, 0.948);
            font-size: 40px;
            text-align: center;
        }

        p {
            font-size: 18px;
        }


        /* =========================
           CLASS
           ========================= */

        .box {
            width: 300px;
            height: 200px;

            background-color: #000000;

            /* Box Model */
            padding: 20px;
            margin: 20px;

            border: 2px solid rgb(242, 245, 245);
            border-radius: 10px;
        }


        /* =========================
           FLEXBOX
           ========================= */

        .container {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 20px;
        }


        /* =========================
           BUTTON
           ========================= */

        button {
            background-color: black;
            color: cyan;

            padding: 10px 20px;

            border: 2px solid cyan;
            border-radius: 8px;

            transition: .3s;
        }


        /* =========================
           HOVER
           ========================= */

        button:hover {
            background-color: cyan;
            color: black;

            transform: scale(1.1);
        }


        /* =========================
           POSITION
           ========================= */

        .card {
            position: relative;

            width: 250px;
            height: 150px;

            background-color: #222;
            border: 2px solid white;
        }

        .badge {
            position: absolute;

            top: 10px;
            right: 10px;

            background-color: red;
            padding: 5px;
        }

    </style>
</head>


<body>

    <h1>MY FIRST CSS WEBSITE</h1>

    <p>This page is made using HTML and CSS.</p>


    <!-- FLEXBOX -->

    <div class="container">

        <div class="box">
            BOX ONE
        </div>

        <div class="box">
            BOX TWO
        </div>

        <div class="box">
            BOX THREE
        </div>

    </div>


    <!-- POSITIONING -->

    <div class="card">

        <div class="badge">
            NEW
        </div>

        <h2>My Card</h2>

    </div>


    <!-- BUTTON -->

    <button>
        ENTER
    </button>


</body>
</html>

</html>
